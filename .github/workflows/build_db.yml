name: Elozmenyek ujraepitese

on:
  push:
    branches: [main]
    paths:
      - "web/data/history/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-db
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SQLite es history_index.json ujraepitese
        run: python3 scripts/build_db.py

      - name: Valtozasok commitolasa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/app.db web/data/history_index.json
          if git diff --cached --quiet; then
            echo "Nincs valtozas, nincs mit commitolni."
          else
            git commit -m "Elozmeny-adatbazis ujraepitese"
            git push
          fi
